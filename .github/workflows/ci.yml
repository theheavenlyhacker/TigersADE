name: CI
on:
  push: { branches: [main, develop] }
  pull_request: { branches: [develop, main] }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tigers
          POSTGRES_PASSWORD: tigers
          POSTGRES_DB: tigers_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tigers -d tigers_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm --filter @tigers/api db:migrate && pnpm --filter @tigers/api db:seed
        env:
          DATABASE_URL: postgres://tigers:tigers@localhost:5432/tigers_test
      - run: pnpm test
        env:
          DATABASE_URL: postgres://tigers:tigers@localhost:5432/tigers_test
      - run: pnpm build
      - run: pnpm --filter @tigers/web exec playwright install --with-deps chromium
      - run: pnpm --filter @tigers/web test:e2e
        env:
          CI: 'true'
          DATABASE_URL: postgres://tigers:tigers@localhost:5432/tigers_test
  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
